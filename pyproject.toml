[project]
name = "jlink-rtt-viewer"
version = "0.8.0"
description = "基于 PySide6 + QFluentWidgets 的 J-Link RTT 查看与内存导出工具"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003：中文全角标点（。，：；！？等）被判定为 ambiguous-unicode-character，
#   对中文项目是纯噪声（本项目曾报 4000+ 条），必须 ignore。
# E501：行太长由 black 统一处理（line-length=100），ruff 重复报无意义。
# B008：函数默认值里实例化对象（如 Signal()），PySide6 信号定义必需，误报。
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_make_backend: 退出 conftest 的 make_backend stub，用真实 make_backend（直接测 _run_flash 的单测用）",
]
