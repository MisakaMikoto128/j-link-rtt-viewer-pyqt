name: release

# 打 v* tag 时自动构建并发布 GitHub Release。
# 用法：git tag v0.11.0 && git push origin v0.11.0
# 产物自动挂到 release，无需手动 gh release create。
#
# 也可手动触发（workflow_dispatch）做链路验证：从 pyproject.toml 读版本号，
# 产出 draft release（不公开、不发通知），确认编译/打包/release 全链路正确。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 版本号：tag 触发时取 tag 名（'v0.11.0'）；手动触发时取 pyproject.toml。
      # 注意 Git 表达式里不允许调函数，故在步骤里用 shell 派生。
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      # shell 里的 gh CLI 需显式注入 token（action 才自动有，原始命令不会）。
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe --tags 需要完整历史

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # 实测 3.13 启动最快，见 docs/python-version-comparison.md
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone
        run: cmd /c .\build_nuitka.bat

      - name: Build onefile
        run: cmd /c .\build_nuitka_onefile.bat

      - name: Derive version and package artifacts
        shell: pwsh
        run: |
          if ($env:IS_MANUAL -eq 'true') {
            # 手动触发：从 pyproject.toml 读版本号（tag 触发时是 vX.Y.Z 由 ref_name 给）
            $v = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            $ver = "v$v"
            Write-Host "manual dispatch: version from pyproject -> $ver"
          } else {
            $ver = "$env:GITHUB_REF_NAME"
            Write-Host "tag dispatch: version from ref -> $ver"
          }
          $version = $ver.Substring(1)     # strip leading 'v'
          $base = "JLinkRTTViewer-$ver-release-win64"
          $dist = "build/dist/$base"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/main.dist/JLinkRTTViewer.exe "$dist/JLinkRTTViewer.exe"
          Copy-Item build/onefile/JLinkRTTViewer.exe "$dist/$base.exe"
          # 7-Zip 非 runner 默认装，用 Compress-Archive 回退。
          Compress-Archive -Path "$dist/JLinkRTTViewer.exe" -DestinationPath "$dist/$base.zip" -CompressionLevel Optimal
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ver=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "base=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract changelog section
        id: notes
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$env:version\](?: - | — )[^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($content, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          if (-not $notes) {
            Write-Host "::warning::CHANGELOG.md 未找到 [$env:version] 小节，release notes 将为空"
            $notes = "见 CHANGELOG.md 的 [$env:version] 小节。"
          }
          $escaped = $notes -replace '%', '%25' -replace "`n", '%0A' -replace "`r", '%0D'
          "body=$escaped" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "notes extracted ($($notes.Length) chars)"

      - name: Check if release already exists
        id: existing
        shell: pwsh
        run: |
          # 手动触发时版本号来自 pyproject.toml = 当前版本，可能已有正式 release。
          # 若 tag 已存在，跳过 release 创建，避免 softprops 更新（污染）正式 release。
          # gh 已注入 GH_TOKEN（job env）。用 $LASTEXITCODE 显式判断，避免 PowerShell
          # if(native) 隐式语义歧义。
          gh release view "$env:ver" --json name -q '.name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::warning::$env:ver release 已存在，跳过 release 创建（只验证构建/打包链路）"
            "release_exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "release_exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create GitHub Release
        if: steps.existing.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ver }}
          name: ${{ env.ver }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}   # 手动触发建 draft（验证链路），tag 触发正式发布
          body: ${{ steps.notes.outputs.body }}
          files: |
            build/dist/${{ env.base }}/${{ env.base }}.zip
            build/dist/${{ env.base }}/${{ env.base }}.exe
